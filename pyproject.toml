[project]
name = "Chronograph"
description = "Sync lyrics of your loved songs"
version = "49"
requires-python = ">=3.13"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
  {name="Dzheremi", email="chichvarov1315@gmail.com"}
]
dependencies = [
  "PyGObject",
  "mutagen==1.47.0",
  "python-magic==0.4.27",
  "requests==2.32.3",
  "pillow==11.0.0",
  "pyyaml==6.0.2",
  "httpx==0.28.1",
  "peewee==3.18.3"
]

[project.urls]
Homepage = "https://github.com/Dzheremi2/Chronograph"
Repository = "https://github.com/Dzheremi2/Chronograph"
Issues = "https://github.com/Dzheremi2/Chronograph/issues"
Changelog = "https://github.com/Dzheremi2/Chronograph/blob/devel/docs/CHANGELOG.md"

[tool.ruff]
indent-width = 2
line-length = 88
builtins = ["_"]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN002",
  "ANN003",
  "ANN202",
  "ANN401",
  "ARG004",
  "BLE001",
  "C901",
  "COM812",
  "D100",
  "D101",
  "D102",
  "D104",
  "D105",
  "D107",
  "D400",
  "D401",
  "D413",
  "D415",
  "E402",
  "E501",
  "E701",
  "EM101",
  "EM102",
  "EXE003",
  "FBT001",
  "FBT002",
  "FBT003",
  "N812",
  "N818",
  "PLC0415",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  "PLR2004",
  "PLW0603",
  "PLW2901",
  "PTH118",
  "PTH123",
  "RET503",
  "RUF012",
  "RUF028",
  "TD001",
  "TD002",
  "TD003",
  "TRY003",
  "TRY300",
  "UP007",
  "UP045",  
  "UP035",
]
exclude = [
  ".flatpak",
  ".flatpak-builder",
  "_build",
  "build"
]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true

[tool.ruff.format]
indent-style = "space"

[tool.ruff.lint.pydocstyle]
convention = "numpy"
property-decorators = ["gi.repository.GObject.Property"]

[tool.ty.rules]
# Since ty cannot read "_" from __builtins__
unresolved-reference = "ignore"

# Since .props in GObjects are not typed
unresolved-attribute = "warn"

# Since exceptions from libraries are linted incorrectly
invalid-exception-caught = "ignore"

# Some complaining onto the GObjectMeta in DGutils
conflicting-metaclass = "ignore" 

# Since some methods assign None to items to GC them.
# Static analyzer doesn't know what None assignment is used for, causing this error to be shown
possibly-missing-attribute = "ignore" 